<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu2</title>
</head>

<body bgcolor="yellow">
    menu2 page 제작:2235020_이도현 <br>
    <hr>
    <a href="http://www.naver.com" onclick="return query()">
        네이버로 이동할 지 물어보는 링크
    </a>
    <form>
        <input type="checkbox">빵(체크 됨) <br>
        <input type="checkbox" onclick="noAction(event)">술(체크 안됨)
    </form> <br>
    <form>
        성별 :
        <input type="radio" value="남" id="sex"> 남
        <input type="radio" value="여" id="sex"> 여<br>
    </form>
    <hr>
    구매물품 선택 
    <br>
    <form>
<input type="checkbox" name="hap" value="10000"
onclick="calc(this)">모자 1만원

<input type="checkbox" name="shose" value="30000"
onclick="calc(this)">구두 3만원

<input type="checkbox" name="bag" value="80000"
onclick="calc(this)">명품가방 8만원

<input type="checkbox" name="sleep" value="50000"
onclick="calc(this)">슬리퍼 5만원

<input type="checkbox" name="glass" value="100000"
onclick="calc(this)">안경 10만원

<br>
지불하실 금액 <input type="text" id="sumtext" value="0" >
</form>
    <script>
        function query() {
            var ret = confirm("네이버로 이동하시겠습니까?");
            return ret;
        }

        function noAction(e) {
            e.preventDefault()
            alert("선택 강제 취소");
        }
    </script>
<script>
    var sum=0;
    function calc(cBox) {
    if(cBox.checked)
    sum += parseInt(cBox.value);
    else
    sum -= parseInt(cBox.value);
    document.getElementById("sumtext").value = sum;
}
</script>
</body>
</html>
